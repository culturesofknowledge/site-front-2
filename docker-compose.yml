volumes:
  redis:
  test_run_state:   # persists .test_run/ results across restarts

services:
  web:
    restart: always
    build:
      context: .
      dockerfile: ./docker-emlo/Dockerfile-flask
    env_file:
      - .env
    expose:
      - "5000"
    ports:
      - 5000:5000
    command: bash -c "/bin/docker-entrypoint.sh"

  # ── Test Runner ───────────────────────────────────────────────────────────
  # Self-contained service. All files live in ./test-runner/.
  # Proxied via the web container — users access it at localhost:5000/test-run.
  # Start independently:  docker compose up test-runner
  # Remove from stack:    comment out this block + TEST_RUNNER_URL in web above
  test-runner:
    build:
      context: ./test-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8085"
    ports:
      - 8085:8085          # internal only — not exposed to host
    volumes:
      - test_run_state:/app/.test_run
    environment:
      DEBUG: "false"
  # ─────────────────────────────────────────────────────────────────────────


  solr:
    build: ./docker-emlo/solr-conf
    restart: always
    environment:
      SOLR_LOG_LEVEL: INFO
      LD_BIND_NOW: 1
    ports:
      - "8983:8983"
    volumes:
      - ./docker-emlo/solr-conf/solr/home:/opt/solr/server/solr/home
      - ./docker-emlo/solr-data:/data-solr
    ulimits:
      nofile:
        soft: "65536"
        hard: "65536"

  redis:
    image: redis:6
    command: redis-server --appendonly yes
    expose:
      - 6379
    ports:
      - 6379:6379
    volumes:
      - redis:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  indexer:
    build:
      context: indexer
      dockerfile: Dockerfile-indexer
    env_file:
      - .env
    command: bash -c "/data/index.sh"
    volumes:
      - ${CSV_FOLDER_IMPORT_PATH}:/data/csv_import_files
