volumes:
  redis:

services:
  web:
    restart: always
    build:
      context: .
      dockerfile: ./docker-emlo/Dockerfile-flask
    env_file:
      - .env
    expose:
      - "5000"
    ports:
      - 5000:5000
    command: python run.py

  solr:
    build: ./docker-emlo/solr-conf
    #restart: no
    environment:
      SOLR_LOG_LEVEL: INFO
      LD_BIND_NOW: 1
    ports:
      - "8983:8983"
    volumes:
      - ./docker-emlo/solr-conf/solr/home:/opt/solr/server/solr/home
      - ./docker-emlo/solr-data:/data-solr
    ulimits:
      nofile:
        soft: "65536"
        hard: "65536"

  redis:
    image: redis:6
    command: redis-server --appendonly yes
    expose:
      - 6379
    ports:
      - 6379:6379
    volumes:
      - redis:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"
